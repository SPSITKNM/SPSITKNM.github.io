<script>try{var t=localStorage.getItem('teren-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<header class="top">

<script>
(function boot() {
  if (!window.TEREN) { return setTimeout(boot, 20); }
  var T = window.TEREN;
  var qs = new URLSearchParams(location.search);
  var s = qs.get('s') || 'pro', slug = qs.get('doc') || '';
  if (!T.SUBJECTS[s]) s = 'pro';
  document.body.setAttribute('data-subject', s);
  document.body.setAttribute('data-slug', s + '/' + slug);
  document.querySelector('[data-crumb-subj]').href = '/predmet.html?s=' + s;
  document.querySelector('[data-crumb-subj]').className = 'lnk s-' + s;
  document.querySelector('[data-tab-subj]').href = '/predmet.html?s=' + s;

  function ready() { return typeof window.marked !== 'undefined' && typeof window.DOMPurify !== 'undefined'; }
  function whenReady(cb) { ready() ? cb() : setTimeout(function () { whenReady(cb); }, 40); }

  function slugify(t) {
    return t.toLowerCase().trim()
      .replace(/[áàä]/g, 'a').replace(/[éèě]/g, 'e').replace(/í/g, 'i').replace(/[óòô]/g, 'o')
      .replace(/[úù]/g, 'u').replace(/ý/g, 'y').replace(/č/g, 'c').replace(/ď/g, 'd').replace(/ĺ/g, 'l')
      .replace(/ľ/g, 'l').replace(/ň/g, 'n').replace(/ŕ/g, 'r').replace(/š/g, 's').replace(/ť/g, 't')
      .replace(/ž/g, 'z').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sekcia';
  }

  fetch('/content/' + s + '.json').then(function (r) { return r.json(); }).then(function (set) {
    var docs = set.docs || [];
    var doc = docs.filter(function (d) { return d.slug === slug; })[0];
    if (!doc) { fail('Dokument „' + slug + '" nie je v zozname predmetu.'); return; }

    document.title = doc.title + ' · ' + set.subject.name;
    document.querySelector('[data-crumb-doc]').textContent = doc.file;
    document.querySelector('[data-a-hd]').textContent = set.subject.name + ' · ' + (doc.kind || 'skriptá').toUpperCase() + (doc.lang && doc.lang.length ? ' · ' + doc.lang.join(', ').toUpperCase() : '');
    document.querySelector('[data-a-title]').textContent = doc.title;
    document.querySelector('[data-a-meta]').innerHTML =
      '<span>' + (doc.words || 0).toLocaleString('sk-SK') + ' slov · ' + T.readingMins(doc.words || 0) + ' min čítania</span>' +
      (doc.updated ? '<span>upravené ' + new Date(doc.updated).toLocaleDateString('sk-SK') + '</span>' : '') +
      '<span><a class="lnk" href="https://github.com/SPSITKNM/' + set.subject.repo + '/blob/main/' + encodeURIComponent(doc.file) + '">zdroj v repe ↗</a></span>';
    var srcUrl = 'https://github.com/SPSITKNM/' + set.subject.repo + '/blob/main/' + encodeURIComponent(doc.file);
    document.querySelector('[data-src-link]').href = srcUrl;
    renderVideo(doc.video || [], set.subject.playlist);

    // prev / next — v poradí trate, inak v poradí docs
    var order = docs.map(function (d) { return d.slug; });
    (set.tracks || []).forEach(function (tr) {
      tr.docs.forEach(function (sl) { if (order.indexOf(sl) < 0) return; });
    });
    var flat = [];
    if ((set.tracks || []).length) {
      set.tracks.forEach(function (tr) { tr.docs.forEach(function (sl) { if (flat.indexOf(sl) < 0 && order.indexOf(sl) >= 0) flat.push(sl); }); });
      order.forEach(function (sl) { if (flat.indexOf(sl) < 0) flat.push(sl); });
    } else flat = order;
    var i = flat.indexOf(slug);
    var pn = document.querySelector('[data-prevnext]');
    function card(sl, dir) {
      var d = docs.filter(function (x) { return x.slug === sl; })[0]; if (!d) return '';
      return '<a class="' + (dir === 'next' ? 'nx' : '') + '" href="/citacka.html?s=' + s + '&doc=' + sl + '">' +
        '<div class="k">' + (dir === 'next' ? 'Ďalšie →' : '← Predošlé') + '</div><b>' + T.esc(d.title) + '</b></a>';
    }
    var html = '';
    if (i > 0) html += card(flat[i - 1], 'prev');
    if (i >= 0 && i < flat.length - 1) html += card(flat[i + 1], 'next');
    if (html) { pn.innerHTML = html; pn.hidden = false; }

    // related
    if ((doc.related || []).length) {
      Promise.all(doc.related.map(function (ref) {
        var rs = ref.split('/')[0], rslug = (ref.split('/')[1] || '').split('#')[0], hash = ref.indexOf('#') >= 0 ? '#' + ref.split('#')[1] : '';
        return fetch('/content/' + rs + '.json').then(function (r) { return r.json(); }).then(function (rset) {
          var rd = (rset.docs || []).filter(function (x) { return x.slug === rslug; })[0];
          return rd ? { s: rs, url: '/citacka.html?s=' + rs + '&doc=' + rslug + hash, title: rd.title } : null;
        }).catch(function () { return null; });
      })).then(function (list) {
        list = list.filter(Boolean).filter(function (x, i, a) { return a.findIndex(function (y) { return y.url === x.url; }) === i; });
        if (!list.length) return;
        document.querySelector('[data-related-wrap]').hidden = false;
        document.querySelector('[data-related]').innerHTML = list.map(function (x) {
          return '<a class="lnk" style="color:var(--' + x.s + ')" href="' + x.url + '">' + T.esc(x.title) + '</a>';
        }).join('');
      });
    }

    // mark read
    var mr = document.querySelector('[data-mark-read]');
    if (T.isRead(s, slug)) { mr.setAttribute('aria-pressed', 'true'); mr.textContent = 'Prečítané'; }
    mr.addEventListener('click', function () {
      var on = T.toggleRead(s, slug);
      mr.setAttribute('aria-pressed', on ? 'true' : 'false');
      mr.textContent = on ? 'Prečítané' : 'Označiť prečítané';
    });
    T.markSeen(s, slug);

    // fetch markdown
    var url = T.RAW + '/' + set.subject.repo + '/main/' + doc.file.split('/').map(encodeURIComponent).join('/');
    whenReady(function () {
      fetch(url, { cache: 'default' }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (md) { render(md, doc, srcUrl); })
        .catch(function () {
          document.querySelector('[data-a-body]').innerHTML =
            '<p class="i2" style="font-family:var(--sans);font-size:14px">Dokument sa teraz nedá načítať. Otvor ho priamo v repozitári: ' +
            '<a class="lnk" href="' + srcUrl + '">' + T.esc(doc.file) + ' ↗</a></p>';
        });
    });
  }).catch(function () { fail('Predmet sa nenačítal.'); });

  function renderVideo(list, playlist) {
    var box = document.querySelector('[data-a-video]');
    if (!list.length) { box.hidden = true; return; }
    var main = list[0], rest = list.slice(1);
    var plHref = playlist ? 'https://www.youtube.com/playlist?list=' + playlist : ('https://www.youtube.com/watch?v=' + main.id);
    var PLAY = '<span class="video__play"><svg viewBox="0 0 68 48" aria-hidden="true"><path d="M66.5 7.7a8 8 0 0 0-5.6-5.7C56 .6 34 .6 34 .6s-22 0-26.9 1.4A8 8 0 0 0 1.5 7.7 84 84 0 0 0 0 24a84 84 0 0 0 1.5 16.3 8 8 0 0 0 5.6 5.7C12 47.4 34 47.4 34 47.4s22 0 26.9-1.4a8 8 0 0 0 5.6-5.7A84 84 0 0 0 68 24a84 84 0 0 0-1.5-16.3z" fill="#f00"/><path d="M45 24 27 14v20z" fill="#fff"/></svg></span>';
    box.innerHTML =
      '<div class="video">' +
      '  <div class="video__hd"><span class="k">Video k tejto téme</span>' +
      '    <a class="lnk" href="' + plHref + '" target="_blank" rel="noopener">celý playlist ↗</a></div>' +
      '  <button type="button" class="video__frame" data-vid="' + main.id + '" aria-label="Prehrať: ' + T.esc(main.title) + '">' +
      '    <img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + main.id + '/hqdefault.jpg">' + PLAY +
      '  </button>' +
      '  <div class="video__cap">' + T.esc(main.title) + '</div>' +
      (rest.length ? '<div class="video__more">' + rest.map(function (v, i) {
        return '<a href="https://www.youtube.com/watch?v=' + v.id + '&list=' + (playlist || '') + '" target="_blank" rel="noopener">' +
          '<span class="ix">' + (i + 2) + '</span><span>' + T.esc(v.title) + '</span></a>';
      }).join('') + '</div>' : '') +
      '</div>';
    box.hidden = false;
    box.querySelector('.video__frame').addEventListener('click', function () {
      this.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + this.getAttribute('data-vid') +
        '?autoplay=1&rel=0&modestbranding=1" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      var cap = box.querySelector('.video__cap'); if (cap) cap.remove();
    });
  }

  function fail(msg) {
    document.querySelector('[data-a-hd]').textContent = 'Chyba';
    document.querySelector('[data-a-title]').textContent = 'Nedá sa zobraziť';
    document.querySelector('[data-a-body]').innerHTML = '<p class="i2" style="font-family:var(--sans);font-size:14px">' + T.esc(msg) + ' Skús <a class="lnk" href="/">hub</a>.</p>';
  }

  var P = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/';
  var prismLoading = null;
  function loadPrism(scope) {
    if (!prismLoading) {
      prismLoading = new Promise(function (res) {
        var s = document.createElement('script');
        s.src = P + 'prism.min.js'; s.setAttribute('data-manual', '');
        s.onload = function () {
          var comps = ['clike', 'c', 'cpp', 'csharp', 'bash', 'docker', 'json'];
          (function next(i) {
            if (i >= comps.length) return res();
            var c = document.createElement('script');
            c.src = P + 'components/prism-' + comps[i] + '.min.js';
            c.onload = c.onerror = function () { next(i + 1); };
            document.head.appendChild(c);
          })(0);
        };
        s.onerror = function () { res(); };
        document.head.appendChild(s);
      });
    }
    prismLoading.then(function () { try { window.Prism && window.Prism.highlightAllUnder(scope); } catch (e) {} });
  }

  var OK_TAGS = /^(a|abbr|b|blockquote|br|code|del|div|em|h[1-6]|hr|i|img|li|ol|p|pre|s|span|strong|sub|sup|table|tbody|td|th|thead|tr|ul)$/i;
  var CODEY = /[;{}]\s*$|^\s*(#include|#define|using\s|namespace\s|template\s*<|for\s*\(|while\s*\(|if\s*\(|else\b|return\b|int\s|void\s|bool\s|char\s|long\s|double\s|float\s|auto\s|const\s|struct\s|class\s|public:|private:|protected:|std::|cout\s*<<|cin\s*>>|printf\(|scanf\(|Console\.|System\.|\$\s|sudo\s|docker\s|git\s|dnf\s|apt\s|systemctl\s|virsh\s)/;
  function looksCodey(l) { return l.trim() !== '' && CODEY.test(l); }

  var FENCE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)/;
  function wrapUnfenced(text) {
    // nezabalený kód → zabaliť do fence (konzervatívne: beh ≥3 riadkov, ≥70 % "kódových")
    var lines = text.split('\n'), out = [], run = [];
    function flush() {
      var solid = run.filter(function (l) { return l.trim() !== ''; });
      var codey = solid.filter(looksCodey).length;
      if (solid.length >= 3 && codey / solid.length >= 0.7) {
        out.push('```', run.join('\n').replace(/^\n+|\n+$/g, ''), '```');
      } else { out.push.apply(out, run); }
      run = [];
    }
    for (var j = 0; j < lines.length; j++) {
      var l = lines[j];
      if (/^\s*(#{1,6}\s|[-*+]\s|\d+\.\s|>|\||!\[|\[.*\]\()/.test(l)) { flush(); out.push(l); continue; }
      if (looksCodey(l) || (run.length && l.trim() === '')) { run.push(l); }
      else { flush(); out.push(l); }
    }
    flush();
    return out.join('\n');
  }
  function escapeAngles(text) {
    // `<vector>` / `<iostream>` mimo fence by inak požral DOMPurify
    return text.replace(/<(\/?)([A-Za-z][\w-]*)((?:\s[^<>]*?)?)\s*(\/?)>/g, function (m, sl, tag) {
      return OK_TAGS.test(tag) ? m : m.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    });
  }
  function preClean(md) {
    // 1) zabaliť nezabalený kód → 2) až potom escape zátvoriek mimo (teraz širších) fence
    md = md.split(FENCE).map(function (c, i) { return i % 2 ? c : wrapUnfenced(c); }).join('');
    return md.split(FENCE).map(function (c, i) { return i % 2 ? c : escapeAngles(c); }).join('');
  }

  function render(md, doc, srcUrl) {
    window.marked.setOptions({ gfm: true, breaks: false });
    var dirty = window.marked.parse(preClean(md));
    var clean = window.DOMPurify.sanitize(dirty, { ADD_ATTR: ['target', 'rel'] });
    var body = document.querySelector('[data-a-body]');
    body.innerHTML = clean;
    T.stripEmojiDom(body);

    // 0) upratanie: zmazať prázdne sekcie (nadpis, po ktorom hneď nasleduje nadpis) a duplikáty
    var hs0 = Array.prototype.slice.call(body.querySelectorAll('h1,h2,h3,h4'));
    hs0.forEach(function (h) {
      var n = h.nextElementSibling;
      var empty = !n || /^H[1-4]$/.test(n.tagName);
      var noisy = /^#?\s*include\b/i.test(h.textContent.trim()) || !h.textContent.trim() ||
        /^[^\wáäčďéíĺľňóôŕšťúýž]+$/i.test(h.textContent.trim());
      if (empty || noisy) h.remove();
    });

    // 1) nadpisy → id + kotva §, TOC (dedup textu)
    var used = {}, seenText = {}, toc = [];
    body.querySelectorAll('h1,h2,h3').forEach(function (h) {
      var txt = h.textContent.trim();
      var base = slugify(txt), id = base, k = 2;
      while (used[id]) id = base + '-' + (k++);
      used[id] = 1; h.id = id;
      var lvl = +h.tagName[1];
      var a = document.createElement('a');
      a.href = '#' + id; a.className = 'anchor'; a.textContent = '§'; a.setAttribute('aria-label', 'Odkaz na sekciu ' + txt);
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var link = location.origin + location.pathname + location.search + '#' + id;
        history.replaceState(null, '', '#' + id);
        h.scrollIntoView();
        if (navigator.clipboard) navigator.clipboard.writeText(link).catch(function () {});
        var live = document.getElementById('teren-live'); if (live) live.textContent = 'Odkaz na sekciu skopírovaný';
      });
      h.insertBefore(a, h.firstChild);
      var key = txt.toLowerCase();
      if (!seenText[key]) { seenText[key] = 1; toc.push({ id: id, lvl: lvl, text: txt }); }
    });

    // 2) TOC — primárna úroveň + zbaliteľné podsekcie
    var counts = { 1: 0, 2: 0, 3: 0 }; toc.forEach(function (t) { counts[t.lvl]++; });
    var primary = counts[2] >= 2 && counts[2] >= counts[1] ? 2 : (counts[1] >= 2 ? 1 : (counts[2] >= 2 ? 2 : Math.min.apply(null, toc.map(function (t) { return t.lvl; }).concat([1]))));
    var subCount = toc.filter(function (t) { return t.lvl > primary; }).length;
    var nav = document.querySelector('[data-toc]');
    document.querySelector('[data-toc-count]').textContent = '· ' + toc.length + ' sekcií';
    nav.innerHTML = toc.map(function (t) {
      var deep = t.lvl > primary;
      return '<a class="' + (deep ? 'lv3' : '') + '" href="#' + t.id + '" data-toc-id="' + t.id + '"' + (deep ? ' data-sub hidden' : '') + '>' + T.esc(t.text) + '</a>';
    }).join('');
    if (subCount) {
      var tgl = document.createElement('button');
      tgl.type = 'button'; tgl.className = 'toc__sub-tgl';
      tgl.textContent = '+ podsekcie (' + subCount + ')';
      tgl.addEventListener('click', function () {
        var on = nav.classList.toggle('subs');
        nav.querySelectorAll('[data-sub]').forEach(function (a) { a.hidden = !on; });
        tgl.textContent = (on ? '– skryť podsekcie' : '+ podsekcie (' + subCount + ')');
      });
      nav.parentNode.insertBefore(tgl, nav.nextSibling);
    }
    nav.addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      var t = document.querySelector('.toc[data-drawer]'); if (t && innerWidth <= 1040) t.classList.remove('open');
    });

    // vrstevnicová kresba: 1 linka = 1 top-level nadpis
    var tops = toc.filter(function (t) { return t.lvl === primary; });
    if (tops.length >= 3) {
      document.querySelector('[data-toc-fig]').hidden = false;
      document.querySelector('[data-toc-contour]').innerHTML =
        T.contourSVG(Math.min(tops.length, 12), 0, 180, 60);
    }

    // kódové bloky → hlavička + kopírovanie
    var hasCode = false;
    body.querySelectorAll('pre').forEach(function (pre) {
      hasCode = true;
      var code = pre.querySelector('code');
      var m = code && (code.className || '').match(/language-([\w-]+)/);
      var lang = m ? m[1] : '';
      var wrap = document.createElement('div'); wrap.className = 'code';
      var hd = document.createElement('div'); hd.className = 'code__hd';
      hd.innerHTML = '<span class="code__lang">' + (lang || 'text') + '</span>' +
        '<button type="button" class="copy"><svg class="ic" width="12" height="12"><use href="/assets/icons.svg#copy"/></svg> kopírovať</button>';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(hd); wrap.appendChild(pre);
    });
    if (hasCode) loadPrism(body);

    // GitHub-style callouts z blockquote
    body.querySelectorAll('blockquote').forEach(function (bq) {
      var first = bq.querySelector('p');
      var mm = first && first.innerHTML.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?/i);
      if (!mm) return;
      var kind = mm[1].toUpperCase();
      var map = { NOTE: ['callout--note', 'Pozn.'], TIP: ['callout--note', 'Tip'], IMPORTANT: ['callout--aside', 'Dôležité'], WARNING: ['callout--warn', 'Pozor'], CAUTION: ['callout--warn', 'Pozor'] };
      first.innerHTML = first.innerHTML.replace(mm[0], '');
      var d = document.createElement('div'); d.className = 'callout ' + map[kind][0];
      d.innerHTML = '<div class="callout__k">' + map[kind][1] + '</div><div class="callout__b">' + bq.innerHTML + '</div>';
      bq.replaceWith(d);
    });

    // externé odkazy
    body.querySelectorAll('a[href^="http"]').forEach(function (a) {
      if (a.host !== location.host) { a.target = '_blank'; a.rel = 'noopener'; }
    });

    // scroll-spy
    var links = {}; document.querySelectorAll('[data-toc-id]').forEach(function (a) { links[a.getAttribute('data-toc-id')] = a; });
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].removeAttribute('aria-current'); });
        var a = links[en.target.id]; if (a) { a.setAttribute('aria-current', 'true'); a.scrollIntoView({ block: 'nearest' }); }
      });
    }, { rootMargin: '-64px 0px -70% 0px' });
    body.querySelectorAll('h1,h2,h3').forEach(function (h) { io.observe(h); });

    // obnova pozície
    var saved = parseFloat(T.ls.get('pos:' + s + '/' + slug, '0'));
    if (!location.hash && saved > 0.04 && saved < 0.95) {
      requestAnimationFrame(function () {
        var d = document.documentElement;
        d.scrollTop = saved * (d.scrollHeight - d.clientHeight);
        var chip = document.createElement('button');
        chip.type = 'button'; chip.className = 'btn btn--sm';
        chip.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:35';
        chip.textContent = 'Pokračuješ, kde si skončil · na začiatok';
        chip.addEventListener('click', function () { scrollTo({ top: 0 }); chip.remove(); });
        document.body.appendChild(chip);
        setTimeout(function () { chip.remove(); }, 6000);
      });
    } else if (location.hash) {
      var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView();
    }
  }
})();
</script>
</body>
